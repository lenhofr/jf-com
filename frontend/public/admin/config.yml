# Decap CMS configuration for jesseforeman.com
#
# Editors reach this at https://jesseforeman.com/admin/. Vite copies
# frontend/public/ verbatim into dist/, so this rides the existing deploy — no
# separate bucket, distribution, or workflow step.
#
# There is no user database. Whoever may edit this site is decided entirely by
# the collaborator list on github.com/lenhofr/jf-com; the OAuth broker hands
# back a token reflecting what that GitHub user could already do.

backend:
  name: github
  repo: lenhofr/jf-com
  branch: main
  # Shared broker, deployed from lenhofr/cms-oauth. It performs the OAuth code
  # exchange that cannot happen in the browser, and serves every site we own.
  base_url: https://cms-auth.lenhof.dev
  auth_endpoint: auth

# Opens a pull request on a cms/ branch instead of committing straight to main.
# This IS the approval gate — GitHub's PR review is the supervising-attorney
# checkpoint, so there is no separate approval UI to build. Removing this line
# lets an editor publish to the live site unreviewed.
publish_mode: editorial_workflow

# Branding. logo_url shows on the login screen and in the editor header;
# site_url and display_url turn the header link into a way back to the live site
# rather than a dead label.
logo_url: /apple-touch-icon.png
site_url: https://jesseforeman.com
display_url: https://jesseforeman.com

media_folder: "frontend/public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Blog posts"
    label_singular: "Blog post"
    description: >-
      Posts appear at /blog and /blog/<slug>. Saving here opens a pull request
      for review; nothing reaches the live site until that PR is merged.
    folder: "content/blog"
    create: true
    # Name the file from the slug field rather than from the title, so the
    # filename and the URL cannot drift apart. generate-posts.mjs warns when
    # they do.
    slug: "{{fields.slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: >-
          URL segment — lowercase letters, numbers and single hyphens. This
          becomes /blog/<slug> and the filename. Changing it on a published post
          breaks any existing link to that post.
        pattern:
          [
            "^[a-z0-9]+(?:-[a-z0-9]+)*$",
            "Lowercase letters, numbers and single hyphens only",
          ]

      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        # Without this, picking a date in a timezone behind UTC can store the
        # previous day, which the site then renders as the wrong month.
        picker_utc: true
        hint: "Sorts the blog, newest first. Displayed as 'March 2026'."

      - label: "Category"
        name: "category"
        widget: "select"
        # Must match postCategories in frontend/src/data/site.ts, which is the
        # canonical list. There is no automated sync — but the build reads that
        # array directly, so a value that drifts out of it fails the build with
        # a clear error rather than rendering wrong.
        options: ["Sports", "Law", "Business", "Technology"]

      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "Teaser shown on /blog, /insights and the home page. One or two sentences."

      - label: "Article image"
        name: "image"
        widget: "image"
        required: false
        # Decap 3.16+: processed in the browser before upload. Uploads were
        # arriving as multi-megabyte PNGs straight from image generators; this
        # centre-crops to the site's 1.91:1 frame, sizes to 1200x630 (the
        # link-preview size), and saves a JPEG. JPEG rather than WebP because
        # this file is also the share image, and not every link-preview client
        # reads WebP. Set aspect_ratio alongside width: width and height
        # together without it would stretch instead of crop.
        media_processing:
          enabled: true
          format:
            enabled: true
            default: jpeg
          quality: 82
          strip_metadata: true
          width: 1200
          aspect_ratio: "1200:630"
        # Uploads land in media_folder and the path written here comes from
        # public_folder, so this ends up as /images/blog/<file>.
        hint: >-
          Shown at the top of the post, on its card in the blog list, and as the
          preview when the post is shared. Uploads are automatically cropped to
          1200×630 from the centre and saved as JPG, so keep anything important
          (like text) away from the top and bottom edges. Leave empty to use
          generated art.

      - label: "Image description"
        name: "imageAlt"
        widget: "string"
        required: false
        # Genuinely optional. Decap cannot make a field required only when
        # another is set, and it labels every non-required field "(optional)",
        # so the build must agree: a missing description falls back to the post
        # title with a warning (generate-posts.mjs) instead of failing.
        hint: >-
          Recommended if you add an image. Describe what the image shows; it is
          read aloud by screen readers. If left blank, the post title is used.

      - label: "Hide from the site"
        name: "draft"
        widget: "boolean"
        required: false
        # Defaults to false because publication is already gated by the pull
        # request. Defaulting to true means a merged post silently never appears
        # until someone remembers to flip it — a failure mode with no error
        # message anywhere.
        default: false
        hint: >-
          Leave off. Turn on only to pull an already-published post from the
          site while keeping the file.

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: >-
          Raw HTML is not rendered — it appears as literal text on the page, and
          HTML comments are stripped at build time.
