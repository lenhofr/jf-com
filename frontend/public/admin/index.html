<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The admin UI is not site content and should never be indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Content admin — Jesse Foreman</title>

  <body>

      Pinned to an exact version rather than a range. This bundle can commit to

      arriving via CDN on someone else's release schedule.
    -->

  </body>
</html>
