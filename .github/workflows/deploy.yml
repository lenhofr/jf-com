name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

# Deploys to main must never overlap. Each one ends with `aws s3 sync --delete`,
# so two running at once delete each other's hashed assets and leave index.html
# pointing at a bundle that no longer exists: a blank site. That happened on
# 2026-09-30 when several CMS edits landed within a minute. Queued runs wait
# instead of cancelling a deploy halfway through its sync; GitHub keeps only the
# newest pending run, which is fine because it builds the latest main anyway.
# Pull requests only run `terraform plan`, so a newer push to the same PR can
# cancel the older plan.
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy-production' || format('plan-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan

      - name: Terraform apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve

      - name: Capture Terraform outputs
        if: github.event_name == 'push'
        id: tf
        run: |
          echo "bucket=$(terraform output -raw site_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "signup_api=$(terraform output -raw signup_api_base_url)" >> "$GITHUB_OUTPUT"
          echo "contact_api=$(terraform output -raw contact_api_base_url)" >> "$GITHUB_OUTPUT"

      # Runs on pull requests too, so a post that fails content validation (for
      # example a CMS post with an image but no description) fails the PR's
      # check instead of breaking every deploy after it merges. On PRs the API
      # URLs are empty, which only affects the forms in that throwaway build.
      - name: Build frontend
        # Taken from Terraform rather than repo variables so the site always
        # targets the APIs this same apply just created. The repo variable for
        # signup kept pointing at the us-west-2 API after the us-east-1 move,
        # and newsletter signups silently failed for months.
        env:
          VITE_SIGNUP_API_URL: ${{ steps.tf.outputs.signup_api }}
          VITE_CONTACT_API_URL: ${{ steps.tf.outputs.contact_api }}
        run: |
          if [ ! -d ../../frontend ]; then
            echo "frontend/ directory not found; skipping frontend deploy."
            exit 0
          fi
          cd ../../frontend
          npm ci
          npm run build

      - name: Upload frontend to S3
        if: github.event_name == 'push'
        run: |
          if [ ! -d ../../frontend/dist ]; then
            echo "No dist/ found; skipping upload."
            exit 0
          fi
          aws s3 sync ../../frontend/dist "s3://${{ steps.tf.outputs.bucket }}" --delete

      # "/*" is a single billable invalidation path (1000/month are free), so a
      # blanket invalidation costs the same as the old three-path list while also
      # covering everything Vite copies verbatim out of frontend/public/ —
      # /admin/config.yml, favicons, robots.txt — which the old list missed.
      - name: Invalidate CloudFront
        if: github.event_name == 'push'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution_id }}" \
            --paths "/*"
